name: Verify

# Lint, typecheck, format check, tests and build on every pull request to main and every push to
# main. Deploys stay with Vercel and Netlify; this only checks the code.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: christfellowshipchurch/.github/.github/workflows/verify-pnpm.yml@d871f3cbd0a39274a30b9a4cfaa03abfad08569c # main
    with:
      test-command: pnpm exec vitest run

  # The check the org ruleset requires. `always()` makes it report even when `checks` fails, is
  # skipped or is cancelled, and it fails unless `checks` succeeded. Don't change it to
  # `!cancelled()`: a skipped required check counts as passing.
  verify:
    name: verify
    needs: [checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the shared checks to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
